# Runs every test on each push and pull request. No secrets: the backend tests use an in-memory
# database and fake models (backend/tests/conftest.py), and never reach Neon, Africa's Talking or MTN.
name: CI

on:
  push:
    branches: [main, feature/real-models]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      SMS_OUTBOX: "0"
      SEED_SAMPLE_DATA: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # as the Docker image
          cache: pip
          cache-dependency-path: backend/requirements-serve.txt
      # What the API serves with, plus CPU-only torch for the three tests that check the ONNX
      # steps match torchvision and the torch decoder (tests/vision/test_onnx_models.py).
      - run: >
          pip install -r requirements-serve.txt pytest==8.3.3
          torch==2.3.0 torchvision==0.18.0 --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # jsdom needs Node 22.10+ (structuredClone markers)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
