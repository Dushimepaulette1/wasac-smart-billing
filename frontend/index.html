<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Mubazi: read your water meter, check the numbers and pay your WASAC bill with MTN Mobile Money." />
    <!-- Installable app (PWA): manifest, icons (source in icons/), service worker (public/sw.js). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mubazi" />
    <!-- iPhone: draw edge to edge under a white-text status bar; content keeps to the safe area
         (styles/base.css), and the strip behind the status bar is night-blue on iOS. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script>
      // Apply the saved theme, or light, before the first paint (see src/theme/theme.ts).
      (function () {
        var t = null;
        try { t = localStorage.getItem('wasac.theme'); } catch (e) {}
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      })();
    </script>
    <title>Mubazi</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this application.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
